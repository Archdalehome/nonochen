name: Deploy to Cloudflare

# Publishes the Worker on every push to main, so the live site follows the repo.
# Can also be started by hand from the Actions tab ("Run workflow"), which is the
# quickest way to redeploy without a commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time: a half-uploaded Worker is worse than a queued one, so a
# running deploy is never cancelled - the next push just waits its turn.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # CLOUDFLARE_API_TOKEN must be a repository secret (see README -> Continuous
  # deployment). The account id is not a credential - it appears in dashboard
  # URLs - so it falls back to the account this repo is bound to.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '7357c2534797a4c04fc95ec58cc04a89' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The images/ diff below needs the previous commit, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Is CLOUDFLARE_API_TOKEN configured?
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error title=Missing CLOUDFLARE_API_TOKEN::Add the secret in Settings -> Secrets and variables -> Actions (see README -> Continuous deployment), then re-run this job."
          exit 1

      - name: Check the views render
        run: npm run check

      - name: Mirror ./images and apply D1 migrations
        run: node scripts/setup.mjs --remote --db-only

      - name: Deploy the Worker
        id: deploy
        run: |
          set -euo pipefail
          npm run deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | head -n1 || true)
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "deployed to ${url:-<no url in wrangler output>}"

      - name: Smoke test the deployment
        if: steps.deploy.outputs.url != ''
        run: node scripts/smoke.mjs "${{ steps.deploy.outputs.url }}"

      - name: Did the push touch images/?
        id: media
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "manual run - syncing every object"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            # New branch or a force push: nothing sensible to diff against.
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "no previous commit to diff - syncing every object"
          elif git diff --quiet "$before" "${{ github.sha }}" -- images/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "./images is unchanged - skipping the R2 sync"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --name-only "$before" "${{ github.sha }}" -- images/
          fi

      - name: Sync ./images to the R2 bucket
        if: steps.media.outputs.changed == 'true'
        run: npm run media:remote -- --concurrency 4

      - name: Keep the Wrangler log when a deploy fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log
          path: deploy.log
          if-no-files-found: ignore
          retention-days: 7
